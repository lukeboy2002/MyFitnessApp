# /etc/nginx/sites-available/myfitnessapp
# Vervang fitness.la-online.nl door je eigen (sub)domein en php8.5 door je PHP-versie.
# Daarna: sudo ln -s /etc/nginx/sites-available/myfitnessapp /etc/nginx/sites-enabled/
#         sudo nginx -t && sudo systemctl reload nginx
#         sudo certbot --nginx -d fitness.la-online.nl   (zet HTTPS aan en past dit bestand aan)

server {
    listen 80;
    listen [::]:80;
    server_name fitness.la-online.nl;
    root /var/www/myfitnessapp/public;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php;
    charset utf-8;

    # Foto's en profielfoto's tot 10 MB
    client_max_body_size 10M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
